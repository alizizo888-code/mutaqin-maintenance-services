name: Build React export

on:
  push:
    branches:
      - main
    paths:
      - "react-export/**"
      - ".github/workflows/build-react-export.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Install dependencies and build React/Vite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        working-directory: react-export
        run: npm install --no-audit --no-fund

      - name: Install browser smoke-test runner
        working-directory: react-export
        run: npm install --no-save --no-package-lock --no-audit --no-fund playwright

      - name: Install Chromium
        working-directory: react-export
        run: npx playwright install --with-deps chromium

      - name: Build production bundle
        working-directory: react-export
        run: npm run build

      - name: Smoke test the production UI
        working-directory: react-export
        run: node scripts/smoke-test.mjs

      - name: Upload production bundle
        uses: actions/upload-artifact@v4
        with:
          name: mutqan-react-dist
          path: react-export/dist/
          if-no-files-found: error
          retention-days: 14
